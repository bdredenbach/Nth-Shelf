name: Page42 source checkpoint
on:
  push:
    branches: [Test_Branch]
    paths: [".github/workflows/page42-source-snapshot.yml"]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a5c288a5692839eac4c5a65fb9581795a047963d
      - name: Archive exact pre-delivery source
        run: |
          git archive --format=zip --output=/tmp/Nth-Shelf-source-a5c288a.zip HEAD
          sha256sum /tmp/Nth-Shelf-source-a5c288a.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Nth-Shelf-source-a5c288a
          path: /tmp/Nth-Shelf-source-a5c288a.zip
          retention-days: 7
          if-no-files-found: error
