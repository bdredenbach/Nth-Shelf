name: Publish Page42 Test33 APK
on:
  push:
    branches: [Test_Branch]
    paths: ['.github/workflows/page42-test33-publish.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.repository == 'bdredenbach/Nth-Shelf' && github.ref == 'refs/heads/Test_Branch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for the verified Test33 artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          root='https://api.github.com/repos/bdredenbach/Nth-Shelf'
          def get(path):
              req=urllib.request.Request(root+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=60) as response:
                  return json.load(response)
          for attempt in range(50):
              artifacts=get('/actions/artifacts?name=Nth-Shelf-2.79.33-Test33&per_page=20').get('artifacts',[])
              valid=[a for a in artifacts if not a.get('expired')]
              if valid:
                  artifact=sorted(valid,key=lambda a:a['created_at'],reverse=True)[0]
                  with open(os.environ['GITHUB_OUTPUT'],'a') as f:
                      f.write('id='+str(artifact['id'])+'\n')
                  print('Found Test33 artifact',artifact['id'])
                  break
              runs=get('/actions/workflows/page42-test33-delivery.yml/runs?branch=Test_Branch&per_page=1').get('workflow_runs',[])
              if runs and runs[0]['status']=='completed' and runs[0].get('conclusion')!='success':
                  raise SystemExit('Test33 build failed; refusing to publish. Inspect '+runs[0]['html_url'])
              time.sleep(20)
          else:
              raise SystemExit('No verified Test33 artifact completed in the bounded wait')
          PY
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.artifact.outputs.id }}
          github-token: ${{ github.token }}
          path: verified-artifact
          merge-multiple: true
      - name: Recheck APK digest and source provenance
        id: provenance
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess,zipfile
          root=pathlib.Path('verified-artifact')
          meta=json.loads((root/'BUILD.json').read_text())
          apk=root/'Nth-Shelf-2.79.33-Test33.apk'
          assert meta['version']=='2.79.33' and meta['versionCode']==27961
          assert meta['applicationId']=='io.github.bdredenbach.nthshelf.frametest33'
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==meta['apkSha256']
          commit=meta['sourceCommit']
          subprocess.run(['git','fetch','origin','Test_Branch'],check=True)
          subprocess.run(['git','merge-base','--is-ancestor',commit,'origin/Test_Branch'],check=True)
          expected=subprocess.check_output(['git','show',commit+':js/panels-curved-rims.js'])
          with zipfile.ZipFile(apk) as z:
              matches=[n for n in z.namelist() if n.startswith('assets/') and n.endswith('js/panels-curved-rims.js')]
              assert len(matches)==1 and z.read(matches[0])==expected
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('source_commit='+commit+'\n')
          print(json.dumps(meta,indent=2))
          PY
      - name: Publish test prerelease without overwriting an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.provenance.outputs.source_commit }}
        run: |
          set -euo pipefail
          TAG=v2.79.33-test33-page42
          if gh release view "$TAG" --repo bdredenbach/Nth-Shelf >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.'
            exit 1
          fi
          gh release create "$TAG" verified-artifact/Nth-Shelf-2.79.33-Test33.apk verified-artifact/Nth-Shelf-2.79.33-Test33-Source.zip verified-artifact/BUILD.json verified-artifact/Test33-Report.md verified-artifact/APK-SIGNATURE.txt verified-artifact/APK-METADATA.txt --repo bdredenbach/Nth-Shelf --target "$SOURCE_COMMIT" --prerelease --title 'Nth Shelf 2.79.33 — Page42 Test33' --notes 'Separate debug test installation: Nth Shelf Test33. Page42 has seven irregular panel detections; Android phone acceptance remains pending. Test32 is not replaced. Source commit and APK checksum are recorded in BUILD.json. Pages43–44 remain in the queue. The complete local project archive additionally preserves the extended raw-capture fixtures that are not part of this bounded runtime import.'
      - name: Record published build metadata on the development branch
        env:
          VERIFIED_ARTIFACT_ID: ${{ steps.artifact.outputs.id }}
        run: |
          set -euo pipefail
          cp verified-artifact/BUILD.json /tmp/test33-build.json
          git fetch origin Test_Branch
          git checkout -B Test_Branch origin/Test_Branch
          python - <<'PY'
          import json,os,pathlib
          data=json.loads(pathlib.Path('/tmp/test33-build.json').read_text())
          data['artifactId']=int(os.environ['VERIFIED_ARTIFACT_ID'])
          data['releaseTag']='v2.79.33-test33-page42'
          data['releaseUrl']='https://github.com/bdredenbach/Nth-Shelf/releases/tag/v2.79.33-test33-page42'
          data['apkDownloadUrl']='https://github.com/bdredenbach/Nth-Shelf/releases/download/v2.79.33-test33-page42/Nth-Shelf-2.79.33-Test33.apk'
          p=pathlib.Path('qa27900/frame-accuracy/test33/delivery/BUILD.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa27900/frame-accuracy/test33/delivery/BUILD.json
          git commit -m 'Record Test33 APK checksum, source commit and prerelease'
          git push origin HEAD:Test_Branch
