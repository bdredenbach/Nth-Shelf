name: Page42 ZIP to Test APK
on:
  push:
    branches: [Test_Branch]
    paths: ['Nth-Shelf-2.79.33-Page42-Project.zip']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nth-shelf-page42-zip-build
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'bdredenbach/Nth-Shelf' && github.ref == 'refs/heads/Test_Branch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import the exact complete source archive
        run: python3 scripts/import-page42-project.py
      - name: Check source and frame contracts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/page42-checks"
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
          node qa27900/frame-accuracy/test33/curved-rim-contract.cjs | tee "$RUNNER_TEMP/page42-checks/frame-contract.json"
          node qa27900/frame-accuracy/test33/service-worker.test.cjs | tee "$RUNNER_TEMP/page42-checks/service-worker.json"
          node qa27900/frame-accuracy/test32/service-worker.test.cjs qa27900/frame-accuracy/test32/sw-baseline.js | tee "$RUNNER_TEMP/page42-checks/baseline-service-worker.json"
      - name: Commit source without overwriting newer changes
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/Test_Branch | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Import complete Page42 2.79.33 source, README, service worker and preserved QA'
            git push origin HEAD:Test_Branch
          fi
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Native archive regression
        run: |
          mkdir -p "$RUNNER_TEMP/nth-archive-tests"
          javac -d "$RUNNER_TEMP/nth-archive-tests" android/app/src/main/java/io/github/bdredenbach/nthshelf/ArchiveIO.java android/archive-tests/ArchiveIOTest.java
          java -ea -Xmx32m -cp "$RUNNER_TEMP/nth-archive-tests" io.github.bdredenbach.nthshelf.ArchiveIOTest
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build separate Test33 APK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          gradle --no-daemon --stacktrace -p android :app:assembleDebug
      - name: Verify APK signature, metadata and packaged source
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Nth-Shelf-2.79.33-Test33.apk
          APK=dist/Nth-Shelf-2.79.33-Test33.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee dist/APK-SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > dist/APK-METADATA.txt
          grep -F "name='io.github.bdredenbach.nthshelf.frametest33'" dist/APK-METADATA.txt
          grep -F "versionCode='27961'" dist/APK-METADATA.txt
          grep -F "versionName='2.79.33'" dist/APK-METADATA.txt
          grep -F 'Nth Shelf Test33' dist/APK-METADATA.txt
          python3 - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          apk=pathlib.Path('dist/Nth-Shelf-2.79.33-Test33.apk')
          checked=[]
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None, 'Corrupt APK'
              for name in z.namelist():
                  if not name.startswith('assets/public/') or name.endswith('/'):
                      continue
                  relative=name[len('assets/public/'):]
                  source=pathlib.Path(relative)
                  assert source.is_file(), 'Unexpected packaged source: '+relative
                  assert z.read(name)==source.read_bytes(), 'Packaged source differs: '+relative
                  checked.append(relative)
          for required in ['index.html','sw.js','js/reader.js','js/panels-curved-rims.js']:
              assert required in checked, 'Missing APK source: '+required
          metadata={'version':'2.79.33','versionCode':27961,'applicationId':'io.github.bdredenbach.nthshelf.frametest33','label':'Nth Shelf Test33','sourceCommit':os.environ['SOURCE_COMMIT'],'apkSha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'apkBytes':apk.stat().st_size,'webAssetsVerifiedExact':checked,'phoneAcceptance':'pending','signing':'Debug key; separate test installation'}
          pathlib.Path('dist/BUILD.json').write_text(json.dumps(metadata,indent=2)+'\n')
          print(json.dumps(metadata,indent=2))
          PY
          cp "$RUNNER_TEMP/page42-checks/"*.json dist/
          cp qa27900/frame-accuracy/test33/RESULTS.md dist/Test33-Report.md
          git archive --format=zip --output=dist/Nth-Shelf-2.79.33-Test33-Source.zip HEAD
      - name: Upload verified test build
        uses: actions/upload-artifact@v4
        with:
          name: Nth-Shelf-2.79.33-Test33
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable test APK
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          TAG="v2.79.33-test33-zip-${RUN_NUMBER}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; preserving it. The verified workflow artifact is available.'
            exit 0
          fi
          gh release create "$TAG" dist/Nth-Shelf-2.79.33-Test33.apk dist/Nth-Shelf-2.79.33-Test33-Source.zip dist/BUILD.json dist/Test33-Report.md --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" --prerelease --title 'Nth Shelf 2.79.33 - Page42 Test33' --notes "Separate Nth Shelf Test33 installation, built from $SOURCE_COMMIT. Keep Test32 and its library. Page42 browser candidate; phone acceptance is pending. Pages43-44 remain queued."
