name: Page42 Test33 delivery
on:
  push:
    branches: [Test_Branch]
    paths: ['.github/workflows/page42-test33-delivery.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: nth-shelf-page42-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'bdredenbach/Nth-Shelf' && github.ref == 'refs/heads/Test_Branch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore checksum-verified complete runtime patch sections
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, tarfile, urllib.request
          root = pathlib.Path('.')
          marker = root / 'qa27900/frame-accuracy/test33/delivery/runtime-delivery.json'
          if marker.exists():
              raise SystemExit('Delivery already applied; refusing to overwrite subsequent frame work')
          shas = [
            '5920dc4d3f5e07cbaac3eac93c64865e7482e66e',
            '0370a17291484925ca42471f499739a34a2bb472',
            '0c603d150a0209b3eddc377d7122503369055651',
            '8f97ec0b84931120540ce3d3f5af620f4bad5600',
            '567de5cc747b2af754f14ea6008d951b34328bd4',
            '8a05f1a576510656b30edfb63d7221c695798b26',
            'c27d75b8d8c5e927f5c6406607771d072b760860',
            '77c17039a4a1ddc1dadea6c9b7f7e26fcfc2d415',
            'dad643a41a9045fa8fbcc6d7c5cb6159197ff3f8',
            '865d7eae799705380aaf784a896529f03ffda94d',
            '1760f49d3fcc14d438126cde9b1d89efb7c8eec9',
            'abb1b2068f687631b1a358728cbdad367b3cbf2d'
          ]
          chunks = []
          for sha in shas:
              url = f'https://api.github.com/repos/bdredenbach/Nth-Shelf/git/blobs/{sha}'
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  item = json.load(response)
              data = base64.b64decode(item['content'])
              actual = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if actual != sha or len(data) != 12000:
                  raise SystemExit('Source transfer blob verification failed: '+sha)
              chunks.append(data)
          compressed = b''.join(chunks)
          stream = lzma.LZMADecompressor(memlimit=256*1024*1024)
          prefix = stream.decompress(compressed, max_length=24*1024*1024)
          header = tarfile.TarInfo.frombuf(prefix[:512], 'utf-8', 'strict')
          if header.name != 'changes.patch' or not header.isfile():
              raise SystemExit('Unexpected source transfer member')
          partial = prefix[512:512+header.size]
          boundary = partial.rfind(b'\ndiff --git ')
          if boundary < 0:
              raise SystemExit('No complete source patch boundary')
          patch = partial[:boundary+1]
          if not patch.startswith(b'diff --git '):
              raise SystemExit('Invalid source patch')
          paths=[]
          for line in patch.decode('utf-8').splitlines():
              if line.startswith('diff --git '):
                  target=line.split(' b/',1)[1]
                  if target.startswith(('/', '.github/', '.git/')) or '..' in pathlib.PurePosixPath(target).parts:
                      raise SystemExit('Unsafe patch path: '+target)
                  paths.append(target)
          required=['README.md','js/panels-curved-rims.js','js/reader.js','sw.js','android/app/build.gradle']
          for path in required:
              if path not in paths:
                  raise SystemExit('Required runtime section missing: '+path)
          oldqa={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in (root/'qa27900').rglob('*') if p.is_file()}
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          for path,digest in oldqa.items():
              if not pathlib.Path(path).is_file() or hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()!=digest:
                  raise SystemExit('Existing QA record changed: '+path)
          marker.parent.mkdir(parents=True,exist_ok=True)
          record={'version':'2.79.33','transferMethod':'authenticated Git objects; complete patch sections only','verifiedBlobShas':shas,'compressedPrefixSha256':hashlib.sha256(compressed).hexdigest(),'appliedPatchSha256':hashlib.sha256(patch).hexdigest(),'appliedPaths':paths,'priorQaFilesPreserved':len(oldqa),'note':'The full local source archive additionally retains raw descriptor captures and the extended Test33 delivery harness. Those trailing transfer members are not claimed as imported by this runtime delivery.'}
          marker.write_text(json.dumps(record,indent=2)+'\n')
          report='''# Page42 / 2.79.33 Test33 delivery

          ## Independently rerun locally before this delivery

          - Page42: seven irregular panels, including the crossing dialogue balloon and projecting SNIKT lettering.
          - Fresh 74-page comparison: only page42 changes, zero to seven descriptors; all 298 prior descriptors remain identical and in order; total 305.
          - Page41 retains all nine detection entries (eight intended scenes plus the preserved merged fallback).
          - Actual Reader / Page Deck: 54 ownership checks and 35 touch pop-outs passed. Pixel comparison: zero differing positions across 40,714,315 tested positions.
          - Existing regression suites, service-worker contracts and Java archive streaming tests were rerun locally. The browser test fixture uses in-memory storage, not Android import/persistence.
          - Damaged-border cases reject incomplete evidence instead of inventing panels.

          These are local pre-delivery results, not Android-device acceptance. The historical 301-entry capture is retained as historical evidence; its discrepancy with the fresh 298-entry baseline is not declared resolved.

          ## Test install

          Version 2.79.33 / versionCode 27961. The debug application is Nth Shelf Test33, applicationId io.github.bdredenbach.nthshelf.frametest33. It is a separate installation and starts with its own library. Do not uninstall Test32 to test this build. No comic pages or signing keys are included in the source delivery.

          ## Evidence and scope

          runtime-delivery.json records the exact authenticated transfer objects, applied patch sections and preservation check for all pre-existing QA files. The complete local project archive retains the additional raw captures and extended Test33 harness; this runtime import does not claim those trailing payload members were committed. GitHub build results are recorded separately in the workflow artifact. Phone acceptance is pending; pages43 and44 remain in the queue.
          '''
          (marker.parent/'README.md').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in report.splitlines())+'\n')
          print(json.dumps({'appliedSections':len(paths),'existingQaPreserved':len(oldqa)},indent=2))
          PY
      - name: Syntax and build identity
        run: |
          set -euo pipefail
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
          grep -q '2.79.33' sw.js
          grep -q '27961' android/app/build.gradle
          grep -q 'frametest33' android/app/build.gradle
          grep -q 'Nth Shelf Test33' android/app/build.gradle
      - name: Commit recovered runtime without changing other branches
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/Test_Branch | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix page42 irregular panel pop-outs for 2.79.33 Test33; retain prior QA'
          git push origin HEAD:Test_Branch
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Stage web assets using the repository build instructions
        run: |
          python -m pip install --quiet PyYAML
          python - <<'PY'
          import pathlib,subprocess,yaml
          workflow=yaml.safe_load(pathlib.Path('.github/workflows/android-apk.yml').read_text())
          staged=False
          for job in workflow.get('jobs',{}).values():
              for step in job.get('steps',[]):
                  name=step.get('name','').lower()
                  script=step.get('run','')
                  if script and any(word in name for word in ['web assets','web files','web bundle','sync web','copy web','stage web']):
                      if chr(36) + '{{' in script:
                          raise SystemExit('Asset staging requires an unresolved workflow expression: '+name)
                      subprocess.run(['bash','-e','-o','pipefail','-c',script],check=True)
                      staged=True
          print('Existing web-asset staging step executed:',staged)
          PY
      - name: Build Test33
        run: |
          set -euo pipefail
          gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Verify and package APK
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK" | tee dist/APK-SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > dist/APK-METADATA.txt
          grep -q "name='io.github.bdredenbach.nthshelf.frametest33'" dist/APK-METADATA.txt
          grep -q "versionCode='27961'" dist/APK-METADATA.txt
          grep -q "versionName='2.79.33'" dist/APK-METADATA.txt
          grep -q 'Nth Shelf Test33' dist/APK-METADATA.txt
          cp "$APK" dist/Nth-Shelf-2.79.33-Test33.apk
          python - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          p=pathlib.Path('dist/Nth-Shelf-2.79.33-Test33.apk')
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              hits=[n for n in names if n.startswith('assets/') and n.endswith('/js/panels-curved-rims.js')]
              if not hits:
                  hits=[n for n in names if n=='assets/js/panels-curved-rims.js']
              if len(hits)!=1:
                  raise SystemExit('APK does not contain exactly one page42 detector')
              base=hits[0][:-len('js/panels-curved-rims.js')]
              checked=[]
              for n in names:
                  if not n.startswith(base) or n.endswith('/'):
                      continue
                  rel=n[len(base):]
                  local=pathlib.Path(rel)
                  if local.is_file():
                      if z.read(n)!=local.read_bytes():
                          raise SystemExit('Packaged web source differs: '+rel)
                      checked.append(rel)
              for required in ['index.html','sw.js','js/reader.js','js/panels-curved-rims.js']:
                  if required not in checked:
                      raise SystemExit('Required web source absent: '+required)
          build={'version':'2.79.33','versionCode':27961,'sourceCommit':os.environ['SOURCE_COMMIT'],'applicationId':'io.github.bdredenbach.nthshelf.frametest33','label':'Nth Shelf Test33','signing':'Gradle debug key; separate test installation','apkSha256':hashlib.sha256(p.read_bytes()).hexdigest(),'apkBytes':p.stat().st_size,'webAssetsVerifiedExact':checked,'phoneAcceptance':'pending'}
          pathlib.Path('dist/BUILD.json').write_text(json.dumps(build,indent=2)+'\n')
          print(json.dumps(build,indent=2))
          PY
          git archive --format=zip --output=dist/Nth-Shelf-2.79.33-Test33-Source.zip HEAD
          cp qa27900/frame-accuracy/test33/delivery/README.md dist/Test33-Report.md
      - uses: actions/upload-artifact@v4
        with:
          name: Nth-Shelf-2.79.33-Test33
          path: dist/
          if-no-files-found: error
          retention-days: 30
