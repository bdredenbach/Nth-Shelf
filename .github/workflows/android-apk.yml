name: Build Test40 APK

on:
  push:
    branches: [Test_Branch]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'android/**'
      - 'js/**'
      - 'css/**'
      - 'assets/**'
      - 'icons/**'
      - 'qa27900/**'
      - 'index.html'
      - 'sw.js'
      - 'manifest.json'
      - 'manifest.webmanifest'
      - 'THIRD_PARTY_NOTICES.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nth-shelf-test40-apk
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'bdredenbach/Nth-Shelf' && github.ref == 'refs/heads/Test_Branch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and retained frame regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
          for suite in auto-scroll frame-geometry-contract gutter-boundaries internal-gutters page-layout closed-frames exterior-gutter-frames gradient-gutter-frames open-regions overlap-frames neighbor-frames panels-partition pilot-strips partition-queue partition-completion uniform-core-partition bubble-selection double-popout; do
            node "qa27900/$suite.cjs" 2>&1 | tee -a dist/regression-checks.txt
          done
          node qa27900/frame-accuracy/test33/curved-rim-contract.cjs 2>&1 | tee -a dist/regression-checks.txt
          node qa27900/frame-accuracy/test34/broad-rim-contract.cjs 2>&1 | tee -a dist/regression-checks.txt
          node qa27900/frame-accuracy/test35/matte-cell-contract.cjs 2>&1 | tee -a dist/regression-checks.txt
          node qa27900/frame-accuracy/test36/edge-spill-contract.cjs 2>&1 | tee -a dist/regression-checks.txt
          node qa27900/frame-accuracy/test37/structural-grid-contract.cjs 2>&1 | tee -a dist/regression-checks.txt
          node qa27900/frame-accuracy/test38/occluded-tier-contract.cjs 2>&1 | tee -a dist/regression-checks.txt
          node qa27900/frame-accuracy/test38/occluded-tier-contract.cjs 2>&1 | tee -a dist/regression-checks.txt
          node qa27900/frame-accuracy/test39/nested-grid-contract.cjs 2>&1 | tee -a dist/regression-checks.txt
          node qa27900/frame-accuracy/test39/nested-grid-contract.cjs 2>&1 | tee -a dist/regression-checks.txt
          node qa27900/frame-accuracy/test40/framed-inset-triplet-contract.cjs 2>&1 | tee -a dist/regression-checks.txt
          node qa27900/frame-accuracy/test40/service-worker.test.cjs 2>&1 | tee -a dist/regression-checks.txt

      - name: Set up browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium

      - name: Browser interaction and backup round-trip checks
        shell: bash
        run: |
          set -euo pipefail
          unset CHROME_BIN CODEX_PRIMARY_RUNTIME_NODE_MODULES
          python3 -m http.server 8765 --bind 127.0.0.1 > dist/http-server.txt 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/ > /dev/null
          node qa27900/brand-integration.cjs 2>&1 | tee dist/branding-check.txt
          node qa27900/stream-integration.cjs 2>&1 | tee dist/backup-check.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Native streaming archive regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nth-archive-tests"
          javac -d "$RUNNER_TEMP/nth-archive-tests" android/app/src/main/java/io/github/bdredenbach/nthshelf/ArchiveIO.java android/archive-tests/ArchiveIOTest.java
          java -ea -Xmx32m -cp "$RUNNER_TEMP/nth-archive-tests" io.github.bdredenbach.nthshelf.ArchiveIOTest | tee dist/native-check.txt

      - uses: android-actions/setup-android@v3
        with:
          # Override v3's default: the obsolete 'tools' package is unavailable.
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build isolated Test40 APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p android :app:assembleDebug 2>&1 | tee dist/gradle-build.txt

      - name: Verify APK signature, identity and exact packaged web files
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee dist/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > dist/package.txt
          grep -F "package: name='io.github.bdredenbach.nthshelf.frametest40'" dist/package.txt
          grep -F "versionCode='27968'" dist/package.txt
          grep -F "versionName='2.79.40'" dist/package.txt
          grep -F "application-label:'Nth Shelf Test40'" dist/package.txt
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          root = pathlib.Path('.')
          apk = root / 'android/app/build/outputs/apk/debug/app-debug.apk'
          singles = {'index.html', 'manifest.json', 'manifest.webmanifest', 'sw.js', 'THIRD_PARTY_NOTICES.txt'}
          directories = {'assets', 'css', 'icons', 'js'}
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          expected = {p for p in tracked if p and (p in singles or p.split('/', 1)[0] in directories)}
          expected.discard('assets/nth-shelf-splash.webp')
          with zipfile.ZipFile(apk) as z:
              if z.testzip():
                  raise SystemExit('APK ZIP integrity check failed')
              prefix = 'assets/public/'
              packaged = {n[len(prefix):] for n in z.namelist() if n.startswith(prefix) and not n.endswith('/')}
              if packaged != expected:
                  raise SystemExit('Web asset set mismatch: '+repr({'missing': sorted(expected-packaged), 'unexpected': sorted(packaged-expected)}))
              hashes = {}
              for rel in sorted(expected):
                  source = (root / rel).read_bytes()
                  if z.read(prefix+rel) != source:
                      raise SystemExit('Packaged web file differs from source: '+rel)
                  hashes[rel] = hashlib.sha256(source).hexdigest()
              for required_detector in ['js/panels-curved-rims.js','js/panels-matte-cells.js','js/panels-edge-spill.js','js/panels-structural-grid.js']:
                  if required_detector not in hashes:
                      raise SystemExit('Frame detector missing: '+required_detector)
          subprocess.run(['git', 'diff', '--exit-code', 'HEAD', '--'], check=True)
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          record = {
              'versionName': '2.79.40', 'versionCode': 27968,
              'applicationId': 'io.github.bdredenbach.nthshelf.frametest40',
              'label': 'Nth Shelf Test40', 'sourceCommit': os.environ['GITHUB_SHA'],
              'signing': 'CI debug key; not a Play Store production key',
              'apkSha256': digest, 'apkBytes': apk.stat().st_size,
              'verifiedWebAssetCount': len(hashes), 'webAssetSha256': hashes,
              'phoneAcceptance': 'pending',
              'comicArtworkTests': 'Saved results retained; comic artwork fixture is not uploaded or rerun by this workflow'
          }
          (root / 'dist/BUILD.json').write_text(json.dumps(record, indent=2)+'\n')
          (root / 'dist/Nth-Shelf-2.79.40-Test40.apk.sha256').write_text(digest+'  Nth-Shelf-2.79.40-Test40.apk\n')
          (root / 'dist/INSTALL.txt').write_text('Keep earlier test builds installed. Install Nth-Shelf-2.79.40-Test40.apk as the separate Nth Shelf Test40 app. Import the comic into its own empty library. Reader pages13, 23, 27 and28 are phone-accepted. Test Reader page32 next: the lower composite must resolve to left scene + tall eye inset + right scene while the existing bottom-left panel remains unchanged. Recheck multiple taps in all three new owners. Phone acceptance for page32 is pending.\n')
          print(json.dumps({'sourceCommit': record['sourceCommit'], 'verifiedWebAssetCount': len(hashes), 'apkSha256': digest}, indent=2))
          PY
          cp "$APK" dist/Nth-Shelf-2.79.40-Test40.apk
          git archive --format=zip --output=dist/Nth-Shelf-2.79.40-Test40-Source.zip HEAD

      - name: Upload verified APK, source and build record
        uses: actions/upload-artifact@v4
        with:
          name: Nth-Shelf-2.79.40-Test40
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Test40-build-diagnostics
          path: |
            dist/*.txt
            dist/*.json
            /tmp/nth-shelf-*.png
          if-no-files-found: ignore
          retention-days: 14
