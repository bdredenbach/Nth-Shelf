name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - Test_Branch
    paths:
      - ".github/workflows/android-apk.yml"
      - "android/**"
      - "index.html"
      - "manifest.json"
      - "manifest.webmanifest"
      - "sw.js"
      - "assets/**"
      - "css/**"
      - "icons/**"
      - "js/**"
      - "qa27900/brand-integration.cjs"
      - "qa27900/stream-integration.cjs"
      - "qa27900/auto-scroll.cjs"
      - "qa27900/frame-geometry-contract.cjs"
      - "qa27900/gutter-boundaries.cjs"
      - "qa27900/internal-gutters.cjs"
      - "qa27900/page-layout.cjs"
      - "qa27900/closed-frames.cjs"
      - "qa27900/exterior-gutter-frames.cjs"
      - "qa27900/gradient-gutter-frames.cjs"
      - "qa27900/open-regions.cjs"
      - "qa27900/neighbor-frames.cjs"
      - "qa27900/panels-partition.cjs"
      - "qa27900/pilot-strips.cjs"
      - "qa27900/partition-queue.cjs"
      - "qa27900/partition-completion.cjs"
      - "qa27900/bubble-selection.cjs"
      - "qa27900/double-popout.cjs"
      - "THIRD_PARTY_NOTICES.txt"

permissions:
  contents: write

concurrency:
  group: nth-shelf-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out tested source
        uses: actions/checkout@v4

      - name: Browser interaction and backup round-trip gate
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/nth-http.log 2>&1 &
          node qa27900/auto-scroll.cjs
          node qa27900/frame-geometry-contract.cjs
          node qa27900/gutter-boundaries.cjs
          node qa27900/internal-gutters.cjs
          node qa27900/page-layout.cjs
          node qa27900/closed-frames.cjs
          node qa27900/exterior-gutter-frames.cjs
          node qa27900/gradient-gutter-frames.cjs
          node qa27900/open-regions.cjs
          node qa27900/neighbor-frames.cjs
          node qa27900/panels-partition.cjs
          node qa27900/pilot-strips.cjs
          node qa27900/partition-queue.cjs
          node qa27900/partition-completion.cjs
          node qa27900/bubble-selection.cjs
          node qa27900/double-popout.cjs
          node qa27900/brand-integration.cjs
          node qa27900/stream-integration.cjs

      - name: Preserve browser test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brand-browser-checks
          path: /tmp/nth-shelf-*.png
          if-no-files-found: ignore

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Native streaming archive regression (600 MiB, 32 MiB heap)
        run: |
          mkdir -p /tmp/nth-archive-tests
          javac -d /tmp/nth-archive-tests android/app/src/main/java/io/github/bdredenbach/nthshelf/ArchiveIO.java android/archive-tests/ArchiveIOTest.java
          java -ea -Xmx32m -cp /tmp/nth-archive-tests io.github.bdredenbach.nthshelf.ArchiveIOTest

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace -p android :app:assembleDebug

      - name: Verify package metadata and signature
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          unzip -t "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING"
          grep -F "package: name='io.github.bdredenbach.nthshelf'" <<<"$BADGING"
          grep -F "versionCode='27925'" <<<"$BADGING"
          grep -F "versionName='2.79.21-test1'" <<<"$BADGING"

      - name: Name release artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Nth-Shelf-V2.79.21-Test1.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nth-Shelf-V2.79.21-Test1
          path: Nth-Shelf-V2.79.21-Test1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish test APK prerelease
        if: github.ref == 'refs/heads/Test_Branch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v2.79.21-test1-${{ github.run_number }}
        run: >-
          gh release create "$RELEASE_TAG"
          Nth-Shelf-V2.79.21-Test1.apk
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --prerelease
          --title "Nth Shelf 2.79.21 Test 1"
          --notes "Installable debug APK built from commit $GITHUB_SHA on Test_Branch. This is a test build, not a Play Store signed release."
