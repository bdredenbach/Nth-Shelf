name: Test32 checkpoint and one-time source import

on:
  push:
    branches: [Test_Branch]
    paths:
      - .github/workflows/import-test32-baseline.yml
      - Nth-Shelf-Frame-Test32.apk
      - scripts/import-test32-baseline.py

permissions:
  contents: write

concurrency:
  group: nth-shelf-test32-baseline-import
  cancel-in-progress: false

jobs:
  checkpoint:
    if: github.repository == 'bdredenbach/Nth-Shelf' && github.ref == 'refs/heads/Test_Branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Export the tracked repository checkpoint
        run: git archive --format=zip --output="$RUNNER_TEMP/Nth-Shelf-Repository-Checkpoint.zip" HEAD
      - name: Preserve the repository checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: Nth-Shelf-Repository-Checkpoint
          path: ${{ runner.temp }}/Nth-Shelf-Repository-Checkpoint.zip
          if-no-files-found: error
          retention-days: 7
      - name: Check whether the one-time source input is present
        id: input
        run: |
          if test -f Nth-Shelf-Frame-Test32.apk && ! test -f qa27900/frame-accuracy/test32/import-completed.json; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Recover the checksum-verified accepted source
        if: steps.input.outputs.ready == 'true'
        run: python3 scripts/import-test32-baseline.py
      - name: Validate recovered JavaScript and cache behavior
        if: steps.input.outputs.ready == 'true'
        run: |
          find js -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
          node --check sw.js
          node qa27900/frame-accuracy/test32/service-worker.test.cjs
      - name: Commit without rewriting history
        if: steps.input.outputs.ready == 'true'
        run: |
          git add -- README.md index.html sw.js manifest.json manifest.webmanifest THIRD_PARTY_NOTICES.txt assets css icons js qa27900/frame-accuracy/test32/import-completed.json qa27900/frame-accuracy/test32/imported-assets.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync accepted Frame Test32 source; reserve 2.79.33 for page42'
          git push origin HEAD:refs/heads/Test_Branch
