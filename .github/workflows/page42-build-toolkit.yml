name: Page42 reproducible build toolkit
on:
  push:
    branches: [Test_Branch]
    paths: [".github/workflows/page42-build-toolkit.yml"]
permissions:
  contents: read
jobs:
  toolkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 84c13d86b60fdc4684cccfdcfad5b684c1df7479
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Resolve the existing native build dependencies
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Export only public build tools and dependency caches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nth-toolkit/sdk/build-tools /tmp/nth-toolkit/sdk/platforms /tmp/nth-toolkit/gradle-home
          cp -a "$ANDROID_HOME/platforms/android-35" /tmp/nth-toolkit/sdk/platforms/
          cp -a "$ANDROID_HOME/build-tools/34.0.0" /tmp/nth-toolkit/sdk/build-tools/
          if test -d "$ANDROID_HOME/licenses"; then cp -a "$ANDROID_HOME/licenses" /tmp/nth-toolkit/sdk/; fi
          GRADLE_BIN="$(readlink -f "$(command -v gradle)")"
          cp -a "$(dirname "$(dirname "$GRADLE_BIN")")" /tmp/nth-toolkit/gradle
          cp -a "$HOME/.gradle/caches" /tmp/nth-toolkit/gradle-home/
          find /tmp/nth-toolkit -type f -name '*.lock' -delete
          test -x /tmp/nth-toolkit/gradle/bin/gradle
          test -x /tmp/nth-toolkit/sdk/build-tools/34.0.0/apksigner
          test -z "$(find /tmp/nth-toolkit -type f \( -name '*.keystore' -o -name '*.jks' -o -name 'gradle.properties' \) -print)"
          tar -C /tmp/nth-toolkit -czf /tmp/Nth-Shelf-build-toolkit.tgz .
          sha256sum /tmp/Nth-Shelf-build-toolkit.tgz
          du -h /tmp/Nth-Shelf-build-toolkit.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: Nth-Shelf-build-toolkit
          path: /tmp/Nth-Shelf-build-toolkit.tgz
          retention-days: 3
          if-no-files-found: error
